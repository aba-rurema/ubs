services:
  postgres:
    image: postgres:17-alpine
    container_name: ubs-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ubs_db
      POSTGRES_USER: ubs_user
      POSTGRES_PASSWORD: ubs_password
    volumes:
      - ubs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubs_user -d ubs_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ubs_pg_data:

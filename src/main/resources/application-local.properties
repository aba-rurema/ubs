# Local development profile — embedded H2 database (no PostgreSQL required)
# After migrating from UUID to Long IDs: delete the ./data folder to recreate the schema.

spring.datasource.url=jdbc:h2:file:./data/ubs_dev;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seed demo users, tariffs, and sample customer/meters for Swagger testing
app.seed.enabled=true

# Local dev: log emails to console instead of sending (set app.mail.enabled=true + spring.mail.* to send real mail)
app.mail.enabled=false
app.mail.from=dev@ubs.local
app.mail.from-name=Utility Billing System (Local)
management.health.mail.enabled=false

app.password-reset.expiration-minutes=60
app.password-reset.base-url=http://localhost:8080/api/swagger-ui.html

app.otp.expiration-minutes=10
app.otp.code-length=6

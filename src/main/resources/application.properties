# Application
spring.application.name=utility-billing-system

# Server
server.port=8080
server.servlet.context-path=/api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ubs_db
spring.datasource.username=ubs_user
spring.datasource.password=ubs_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=change-this-secret-key-to-a-secure-256-bit-value-in-production
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.groups-order=asc
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.writer-with-order-by-keys=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Billing
app.billing.vat-rate=18.0
app.billing.penalty-rate=5.0
app.billing.due-days=30
app.billing.rates.water=500.00
app.billing.rates.electricity=120.00
app.billing.overdue-cron=0 0 1 * * *

# Email — Gmail SMTP (set MAIL_PASSWORD env var with your Google App Password)
app.mail.enabled=true
app.mail.from=hirwareponse@gmail.com
app.mail.from-name=Utility Billing System
app.mail.delivery-poll-ms=60000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hirwareponse@gmail.com
spring.mail.password=${uvho whnh ipwv epnn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

management.health.mail.enabled=true

# Password reset
app.password-reset.expiration-minutes=60
app.password-reset.base-url=http://localhost:3000/reset-password

# OTP verification (login and register)
app.otp.expiration-minutes=10
app.otp.code-length=6
